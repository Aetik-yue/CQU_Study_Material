# ==========================================================
# 数据库与连接池配置（rbac-cli）
# ==========================================================
# 修改用户名/密码以匹配本机 MySQL
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/rbac_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
jdbc.username=root
jdbc.password=root

# HikariCP 连接池
pool.maximumPoolSize=10
pool.minimumIdle=2
pool.connectionTimeout=10000

# 首次启动自动建表并初始化数据（库不存在时会自动创建）
db.autoInit=true
# 是否初始化演示数据（其他角色示例用户，便于演示动态菜单/角色继承；生产可改为 false）
db.initDemoData=true

# 命令行界面：彩色输出 / 清屏 / 24 位真彩（自动判断：非交互环境会忽略）
ui.color=true
ui.clearScreen=true
# 终端不支持真彩时可改为 false（自动降级为 256 色）
ui.trueColor=true
